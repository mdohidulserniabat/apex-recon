id: exposed-sensitive-files
info:
  name: Exposed Sensitive Files & Config
  author: apex-recon
  severity: high
  description: Checks for commonly exposed sensitive files.
  tags: exposure,config,files
http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/.env.production"
      - "{{BaseURL}}/.git/config"
      - "{{BaseURL}}/.git/HEAD"
      - "{{BaseURL}}/config.json"
      - "{{BaseURL}}/.aws/credentials"
      - "{{BaseURL}}/docker-compose.yml"
      - "{{BaseURL}}/.npmrc"
      - "{{BaseURL}}/phpinfo.php"
      - "{{BaseURL}}/server-status"
      - "{{BaseURL}}/actuator/env"
      - "{{BaseURL}}/actuator/health"
      - "{{BaseURL}}/.DS_Store"
      - "{{BaseURL}}/backup.zip"
      - "{{BaseURL}}/api/swagger.json"
      - "{{BaseURL}}/swagger-ui.html"
    stop-at-first-match: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex:
          - "(?i)(aws_access_key_id|db_password|secret_key|api[_-]?key|BEGIN RSA|\\[core\\]|password\\s*=|mongodb://|postgres://|mysql://)"
