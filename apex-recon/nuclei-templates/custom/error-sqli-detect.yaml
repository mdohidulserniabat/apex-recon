id: error-based-sqli-detect
info:
  name: Error-Based SQL Injection (single quote)
  author: apex-recon
  severity: high
  description: Sends a single quote and matches common DB error signatures. Confirm manually.
  tags: sqli,error
http:
  - method: GET
    path:
      - "{{BaseURL}}'"
    matchers-condition: or
    matchers:
      - type: word
        part: body
        name: mysql
        words:
          - "You have an error in your SQL syntax"
          - "check the manual that corresponds to your MySQL"
          - "MySqlException"
        condition: or
      - type: word
        part: body
        name: postgres
        words:
          - "PostgreSQL query failed"
          - "pg_query()"
          - "unterminated quoted string at or near"
        condition: or
      - type: word
        part: body
        name: mssql
        words:
          - "Unclosed quotation mark after the character string"
          - "Microsoft OLE DB Provider for SQL Server"
          - "System.Data.SqlClient.SqlException"
        condition: or
      - type: word
        part: body
        name: oracle
        words: ["ORA-00933", "ORA-01756", "Oracle error"]
        condition: or
