id: apex-nextjs-ai-graphql-checks
info:
  name: Apex Recon Modern Target Vulnerability Audit (NextJS, AI APIs, GraphQL BOLA)
  author: apex-recon
  severity: high
  tags: nextjs,ai,graphql,cve,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/_next/image?url=https://oast.me"
      - "{{BaseURL}}/_next/data/latest/index.json"
      - "{{BaseURL}}/v1/chat/completions"
      - "{{BaseURL}}/v1/messages"
      - "{{BaseURL}}/api/graphql?query={__schema{types{name}}}"
      - "{{BaseURL}}/.well-known/openid-configuration"

    matchers-condition: or
    matchers:
      - type: word
        words:
          - "Image Optimizer"
          - "openai"
          - "anthropic"
          - "__schema"
        part: body

      - type: status
        status:
          - 200
