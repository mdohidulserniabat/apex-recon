id: security-txt-present

info:
  name: security.txt Present (Informational)
  author: apex-recon
  severity: info
  description: |
    Notes that a .well-known/security.txt file was found (RFC 9116). This is
    a GOOD security practice, not an exposure — kept separate from
    modern-web-exposures.yaml so it never gets reported/alerted as a finding.
  tags: info,security-txt,best-practice

http:
  - method: GET
    path:
      - "{{BaseURL}}/.well-known/security.txt"
    redirects: true
    max-redirects: 2
    matchers:
      - type: word
        part: body
        words:
          - 'Contact:'
          - 'Expires:'
        condition: and

    extractors:
      - type: kval
        kval:
          - "path"
