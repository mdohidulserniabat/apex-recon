id: api-schema-exposure

info:
  name: Public API Schema and Documentation Exposure
  author: apex-recon
  severity: low
  description: Identifies exposed API schemas or interactive documentation; assess whether sensitive operations are unauthenticated.
  tags: api,swagger,openapi,graphql,exposure

http:
  - method: GET
    path:
      - "{{BaseURL}}/openapi.json"
      - "{{BaseURL}}/swagger.json"
      - "{{BaseURL}}/api-docs"
      - "{{BaseURL}}/v3/api-docs"
      - "{{BaseURL}}/swagger-ui/index.html"
    redirects: true
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - '"openapi"'
          - '"paths"'
        condition: and
      - type: word
        part: body
        words:
          - '"swagger"'
          - '"paths"'
        condition: and
      - type: word
        part: body
        words:
          - 'Swagger UI'
